# Nasadenie banner service na Fly.io (alternatíva k Railway).
#
#   fly launch --no-deploy --copy-config
#   fly volumes create ckdaka_cache --size 3
#   fly secrets set PUBLIC_URL=https://<app>.fly.dev LINK_TEMPLATE='...'
#   fly deploy
app = "ckdaka-banner"
primary_region = "fra"          # Frankfurt – najbližšie k SK

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "3457"
  HOST = "0.0.0.0"
  CACHE_DIR = "/data"

[[mounts]]
  source = "ckdaka_cache"
  destination = "/data"

[http_service]
  internal_port = 3457
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Aspoň jeden bežiaci stroj: platformy si sťahujú feedy aj v noci
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"
